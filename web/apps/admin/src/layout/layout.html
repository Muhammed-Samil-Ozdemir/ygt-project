<div class="admin-shell">
  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="sidebar-head">
      <a routerLink="/" class="sidebar-brand" (click)="closeMenu()">
        <img src="images/logo.png" alt="" width="30" height="31" />
        <span>
          <strong>YGT</strong>
          <small>Yönetim paneli</small>
        </span>
      </a>
      <button
        type="button"
        class="btn btn-icon sidebar-toggle"
        aria-controls="admin-menu"
        [attr.aria-label]="menuOpen() ? 'Menüyü kapat' : 'Menüyü aç'"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <ygt-icon [name]="menuOpen() ? 'x' : 'menu'" />
      </button>
    </div>

    <div id="admin-menu" class="sidebar-menu">
      <nav class="sidebar-nav">
        @for (item of nav; track item.link) {
          <a
            class="sidebar-link"
            [routerLink]="item.link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            (click)="closeMenu()"
          >
            <ygt-icon [name]="item.icon" />
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="sidebar-foot">
        <a class="sidebar-link" href="/" target="_blank" rel="noopener">
          <ygt-icon name="external" />
          Siteyi aç
        </a>
        <button type="button" class="sidebar-link" (click)="logout()">
          <ygt-icon name="logout" />
          Çıkış
        </button>
      </div>
    </div>
  </aside>

  <main class="admin-main">
    <router-outlet />
  </main>
</div>
