<div class="page-header">
  <div>
    <h1>Site içeriği</h1>
    <p class="muted">
      Sitedeki bütün yazılar, logo ve görseller, ekip, teknolojiler ve bağlantılar. Değişiklikler site yenilendiğinde
      görünür.
    </p>
  </div>
  <a class="btn btn-outline" href="/" target="_blank" rel="noopener">
    <ygt-icon name="external" />
    Siteyi aç
  </a>
</div>

<nav class="tabs" aria-label="İçerik türleri">
  @for (tab of tabs; track tab.link) {
    <a class="tab" [routerLink]="tab.link" routerLinkActive="active">
      <ygt-icon [name]="tab.icon" />
      {{ tab.label }}
    </a>
  }
</nav>

<router-outlet />
