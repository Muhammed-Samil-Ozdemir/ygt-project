<div class="page-header">
  <h1>{{ id() ? 'Eğitimi düzenle' : 'Yeni eğitim' }}</h1>
</div>

<div class="card editor-card">
  @if (!loaded()) {
    <p class="loading">Yükleniyor...</p>
  } @else {
    <form class="stack" (ngSubmit)="save()" novalidate>
      <div class="field">
        <label for="title">Başlık</label>
        <input id="title" class="input" name="title" [(ngModel)]="model.title" />
      </div>
      <div class="field">
        <label for="content">Açıklama <span class="optional">(isteğe bağlı)</span></label>
        <textarea id="content" class="textarea" name="content" [(ngModel)]="model.content"></textarea>
        <p class="hint">Başvuru sayfasında eğitim seçilince görünür.</p>
      </div>

      @if (!id()) {
        <p class="notice small">
          Eğitim başvurulara açık olarak oluşturulur ve ana sayfadaki buton "Eğitim Başvurusu" olur.
        </p>
      }

      <div class="row">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
        </button>
        <a class="btn btn-ghost" routerLink="/courses">Vazgeç</a>
      </div>
    </form>
  }
</div>
