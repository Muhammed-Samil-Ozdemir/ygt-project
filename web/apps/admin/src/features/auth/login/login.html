<div class="login-page">
  <div class="login-glow" aria-hidden="true"></div>
  <div class="card login-card">
    <div class="login-head">
      @if (brand.logo(); as logo) {
        <img class="login-logo" [src]="logo" alt="" />
      }
      <h1>Yönetim paneli</h1>
      @if (brand.siteName(); as siteName) {
        <p class="muted small">{{ siteName }}</p>
      }
    </div>

    <form class="stack" (ngSubmit)="login()" novalidate>
      <div class="field">
        <label for="email">E-posta</label>
        <input id="email" class="input" type="email" name="email" autocomplete="username" [(ngModel)]="model.email" />
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <input
          id="password"
          class="input"
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="model.password"
        />
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="sending()">
        {{ sending() ? 'Giriş yapılıyor...' : 'Giriş yap' }}
      </button>
    </form>
  </div>
</div>
