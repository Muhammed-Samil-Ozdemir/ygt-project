<a class="back-link small" routerLink="/users">Yöneticiler</a>

<div class="page-header">
  <div>
    <h1>Şifre belirle</h1>
    @if (user(); as user) {
      <p class="muted">{{ user.name }} ({{ user.email }})</p>
    }
  </div>
</div>

<div class="card editor-card">
  @if (!user()) {
    <p class="loading">Yükleniyor...</p>
  } @else {
    <form class="stack" (ngSubmit)="save()" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="password">Yeni şifre</label>
          <input id="password" class="input" type="password" name="password" autocomplete="new-password" [(ngModel)]="password" />
          <p class="hint">En az 8 karakter.</p>
        </div>
        <div class="field">
          <label for="passwordRepeat">Yeni şifre (tekrar)</label>
          <input
            id="passwordRepeat"
            class="input"
            type="password"
            name="passwordRepeat"
            autocomplete="new-password"
            [(ngModel)]="passwordRepeat"
          />
        </div>
      </div>

      <p class="notice small">Yöneticinin eski şifresi hemen geçersiz olur. Yeni şifreyi kişiye güvenli bir yoldan iletin.</p>

      <div class="row">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Kaydediliyor...' : 'Şifreyi belirle' }}
        </button>
        <a class="btn btn-ghost" routerLink="/users">Vazgeç</a>
      </div>
    </form>
  }
</div>
