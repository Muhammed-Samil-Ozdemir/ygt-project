<div class="counter-page">
  <div class="counter-glow" aria-hidden="true"></div>
  @let texts = content()?.texts;
  @if (texts && texts.logo) {
    <img class="counter-logo" [src]="imageUrl(texts.logo)" [alt]="texts.siteName" />
  }

  @if (countdown(); as countdown) {
    <h1 class="counter-title">{{ countdown.title }}</h1>
    <div class="counter-grid">
      @for (part of countdown.parts; track part.unit) {
        <div class="counter-cell">
          <span class="counter-value">{{ part.value }}</span>
          <span class="counter-unit">{{ part.unit }}</span>
        </div>
      }
    </div>
  } @else if (loaded() && texts) {
    <h1 class="counter-title">{{ texts.counterIdleTitle }}</h1>
  }
</div>
