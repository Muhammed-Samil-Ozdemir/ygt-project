<div class="counter-page">
  <img class="counter-logo" src="images/logo.png" alt="Yazılım Geliştirme Topluluğu logosu" width="120" height="126" />

  @if (countdown(); as countdown) {
    <h1 class="counter-title">{{ countdown.title }}</h1>
    <div class="counter-grid">
      @for (part of countdown.parts; track part.unit) {
        <div class="counter-cell">
          <span class="counter-value">{{ part.value.toString().padStart(2, '0') }}</span>
          <span class="counter-unit">{{ part.unit }}</span>
        </div>
      }
    </div>
  } @else if (loaded()) {
    <h1 class="counter-title">Hoş geldiniz!</h1>
  }
</div>
