# Site "/", yönetim paneli "/admin/", API "/api/" altında aynı adresten sunulur.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sertifika görseli ve ekip fotoğrafı yükleme (API en fazla 5 MB kabul ediyor).
    client_max_body_size 6m;

    # Eski sistemdeki sertifika linkleri (/api/certs?certID=...) yeni doğrulama sayfasına gider.
    location = /api/certs {
        return 301 /certs$is_args$args;
    }

    # /api/ önekiyle gelen istekler önek atılarak API konteynerine aktarılır.
    # "^~": ekip fotoğrafı gibi .jpg ile biten API adresleri aşağıdaki statik dosya kuralına düşmesin.
    location ^~ /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Derlenen dosyaların adında içerik özeti var, uzun süre önbellekte kalabilir.
    location ~* \.(?:js|css|ttf|woff2?|png|jpe?g|webp|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
