# YGT: veritabanı, API ve ön yüz tek komutla ayağa kalkar.
# Şimdilik veritabanı ve API var; ön yüz (nginx) sonraki aşamada eklenecek.
# Kullanım: .env.example dosyasını .env olarak kopyalayın, sonra: docker compose up -d --build
name: ygt

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env dosyasında ayarlanmalı}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=mssql,1433;Database=Ygt;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY .env dosyasında ayarlanmalı}
      Seed__Admin__Email: ${ADMIN_EMAIL:-admin@ygt.com}
      Seed__Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env dosyasında ayarlanmalı}
    volumes:
      - api-storage:/app/storage
    depends_on:
      mssql:
        condition: service_healthy
    # Geçici: ön yüz eklenince API dışarı açılmayacak, nginx üzerinden /api altında erişilecek.
    ports:
      - "${API_PORT:-5080}:8080"
    restart: unless-stopped

volumes:
  mssql-data:
  api-storage:
